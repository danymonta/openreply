# OpenReply — full self-hosted stack (Percorso Alpha)
#
#   Local:      docker compose -f compose.selfhost.yml --profile local up -d --build
#   Production: docker compose -f compose.selfhost.yml --profile prod up -d --build
#
# Every secret comes from the untracked .env next to this file (see .env.example).
# Postgres and Redis are never published to the host: only the internal network
# reaches them. The web app is published on 127.0.0.1 only; in production Caddy
# is the single public entry point (ports 80/443) and terminates HTTPS.

x-app: &app
  build: .
  image: openreply:selfhost
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql://openreply:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/openreply
    REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: openreply
      POSTGRES_USER: openreply
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openreply -d openreply"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ needs noeviction, otherwise queued DMs can be silently dropped.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # One-shot: applies pending Prisma migrations, then exits.
  migrate:
    <<: *app
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]

  web:
    <<: *app
    command: ["sh", "scripts/start.sh"]
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["npm", "run", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  cron:
    <<: *app
    command: ["sh", "scripts/cron.sh"]
    environment:
      CRON_BASE_URL: http://web:3000
      DATABASE_URL: postgresql://openreply:${POSTGRES_PASSWORD}@postgres:5432/openreply
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      web:
        condition: service_started

  # Local only: catches magic-link emails. Inbox UI at http://localhost:8025
  mailpit:
    profiles: ["local"]
    image: axllent/mailpit:v1.32
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  # Production only: HTTPS reverse proxy with automatic Let's Encrypt certificates.
  caddy:
    profiles: ["prod"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      OPENREPLY_DOMAIN: ${OPENREPLY_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
